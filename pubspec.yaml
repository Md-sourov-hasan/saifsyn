name: saifsyn
description: Base GetX boilerplate project
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  intl: ^0.20.2
  logger: ^2.6.2
  webview_flutter: ^4.13.1
  flutter_test:
    sdk: flutter
  image_picker: ^1.2.1
  fl_chart: ^1.1.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - lib/l10n/
